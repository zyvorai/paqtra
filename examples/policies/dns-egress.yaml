# Example CiliumNetworkPolicy: DNS egress
# Allow all pods to reach DNS servers
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-egress-policy
  namespace: default
  annotations:
    paqtra.io/generated: "true"
    paqtra.io/confidence: "98.7"
    paqtra.io/description: "Allow DNS queries to cluster DNS and public DNS"
spec:
  endpointSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      rules:
        dns:
        - matchPattern: "*"
  - toFQDNs:
    - matchName: "dns.google"
    - matchName: "cloudflare-dns.com"
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
