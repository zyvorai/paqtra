# Example CiliumNetworkPolicy: Allow frontend to backend
# Generated by Paqtra AutoPolicy with 95% ML confidence
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-frontend-backend
  namespace: default
  annotations:
    paqtra.io/generated: "true"
    paqtra.io/confidence: "95.2"
    paqtra.io/learning-duration: "7d"
    paqtra.io/observations: "1247"
spec:
  endpointSelector:
    matchLabels:
      app: backend
      tier: api
  ingress:
