services:
  redis:
    image: redis:7-alpine
    container_name: cilium-vision-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ../web-api
      dockerfile: Dockerfile
    container_name: cilium-vision-api
    ports:
      - "9191:9191"
    environment:
      - HOST=0.0.0.0
      - PORT=9191
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (at least 32 characters)}
      - HUBBLE_ADDRESS=${HUBBLE_ADDRESS:-localhost:4245}
      - RUST_LOG=info,cilium_vision_api=debug
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3000,http://localhost:9191
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9191/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    # On Linux, use host network mode or extra_hosts for host access
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build:
      context: ../web-ui
      dockerfile: Dockerfile
    container_name: cilium-vision-ui
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:

networks:
  default:
    name: cilium-vision-network
