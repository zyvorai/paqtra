services:
  redis:
    image: redis:7-alpine
    container_name: cilium-vision-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save 60 1000 --save 300 100
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: ../web-api
      dockerfile: Dockerfile
    container_name: cilium-vision-api
    ports:
      - "${API_PORT:-9191}:9191"
    environment:
      - HOST=0.0.0.0
      - PORT=9191
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - HUBBLE_ADDRESS=${HUBBLE_ADDRESS:-hubble-relay.kube-system.svc.cluster.local:4245}
      - RUST_LOG=${RUST_LOG:-info,cilium_vision_api=debug}
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3000,http://localhost:8080
    volumes:
      - ${KUBECONFIG:-~/.kube/config}:/home/appuser/.kube/config:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9191/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build:
      context: ../web-ui
      dockerfile: Dockerfile
    container_name: cilium-vision-ui
    ports:
      - "${UI_PORT:-3001}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:

networks:
  default:
    name: cilium-vision-network
