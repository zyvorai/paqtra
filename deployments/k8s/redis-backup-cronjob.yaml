apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: cilium-system
  labels:
    app: cilium-vision
    component: redis-backup
spec:
  schedule: "0 2 * * *"  # 2 AM daily
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: redis:7-alpine
            command: ["sh", "-c", "redis-cli -h cilium-vision-redis BGSAVE && sleep 5 && cp /data/dump.rdb /backup/dump-$(date +%Y%m%d).rdb"]
            volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: backup
              mountPath: /backup
          volumes:
          - name: redis-data
            persistentVolumeClaim:
              claimName: redis-data
          - name: backup
            persistentVolumeClaim:
              claimName: redis-backup
          restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-backup
  namespace: cilium-system
  labels:
    app: cilium-vision
    component: redis-backup
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
