apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilium-vision-ui
  namespace: cilium-system
  labels:
    app: cilium-vision
    component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cilium-vision
      component: ui
  template:
    metadata:
      labels:
        app: cilium-vision
        component: ui
    spec:
      containers:
      - name: ui
        image: ghcr.io/ssahani/cilium-flow-ui:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: API_URL
          value: "http://cilium-vision-api:9191"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: cilium-vision-ui
  namespace: cilium-system
  labels:
    app: cilium-vision
    component: ui
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: cilium-vision
    component: ui
