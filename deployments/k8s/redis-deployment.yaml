apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilium-vision-redis
  namespace: cilium-system
  labels:
    app: cilium-vision
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cilium-vision
      component: redis
  template:
    metadata:
      labels:
        app: cilium-vision
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cilium-vision-redis
  namespace: cilium-system
  labels:
    app: cilium-vision
    component: redis
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  selector:
    app: cilium-vision
    component: redis
