apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-vision-config
  namespace: cilium-system
  labels:
    app: cilium-vision
data:
  config.yaml: |
    api:
      host: "0.0.0.0"
      port: 8080
      cors_allowed_origins:
        - "https://cilium-vision.example.com"

    hubble:
      address: "hubble-relay.kube-system.svc.cluster.local:4245"

    redis:
      url: "redis://cilium-vision-redis:6379"
      cache_ttl_seconds: 60

    features:
      anomaly_detection: true
      compliance: true
      autopolicy: true
      chaos: true
      canary: true

    logging:
      level: "info"
      format: "json"
