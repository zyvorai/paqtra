apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cilium-vision
  namespace: cilium-system
  labels:
    app: cilium-vision
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/websocket-services: "cilium-vision-api"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cilium-vision.example.com
    secretName: cilium-vision-tls
  rules:
  - host: cilium-vision.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cilium-vision-api
            port:
              number: 9191
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cilium-vision-ui
            port:
              number: 80
