# WARNING: Replace all values before applying.
# Generate secrets with:
#   openssl rand -base64 48   # JWT
#   openssl rand -base64 18   # admin password (≥12 chars after decode)
apiVersion: v1
kind: Secret
metadata:
  name: paqtra-secrets
  namespace: cilium-system
  labels:
    app: paqtra
type: Opaque
stringData:
  jwt-secret: "REPLACE_WITH_RANDOM_64_CHAR_SECRET"
  admin-username: "admin"
  admin-password: "REPLACE_WITH_STRONG_PASSWORD_MIN_12_CHARS"
  # Optional alternate API key (can match admin-password or be empty)
  api-key: ""
