apiVersion: v1
kind: Secret
metadata:
  name: cilium-vision-secrets
  namespace: cilium-system
  labels:
    app: cilium-vision
type: Opaque
stringData:
  # IMPORTANT: Replace this with a secure random value before deploying!
  # Generate one with: openssl rand -base64 48
  jwt-secret: "change-me-in-production-use-random-64-char-string"
  # Add other secrets as needed
  # database-url: "postgresql://user:password@host:5432/dbname"
