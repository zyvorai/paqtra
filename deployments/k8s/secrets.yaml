# WARNING: Replace all values before applying. Generate JWT_SECRET with: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: paqtra-secrets
  namespace: cilium-system
  labels:
    app: paqtra
type: Opaque
stringData:
  jwt-secret: "REPLACE_WITH_RANDOM_64_CHAR_SECRET"
  # Add other secrets as needed
  # database-url: "postgresql://user:password@host:5432/dbname"
