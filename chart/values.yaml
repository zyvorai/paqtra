nameOverride: ""
fullnameOverride: ""

# -- Global settings
global:
  # -- Namespace to deploy into
  namespace: paqtra
  # -- Image pull secrets
  imagePullSecrets: []

# -- API server configuration
api:
  image:
    repository: ghcr.io/zyvorai/paqtra-api
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 2
  port: 9191
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    # Cilium's hubble-relay Service maps port 80 → container 4245 (gRPC).
    # Use the Service port in-cluster; use localhost:4245 with port-forward locally.
    hubbleAddress: "hubble-relay.kube-system.svc.cluster.local:80"
    jwtSecret: ""  # auto-generated if empty
    rustLog: "info"
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 9191
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # -- Persist alert rules, audit log, exports, change history, and the flow
  # index in SQLite so investigations survive restarts. SQLite is single-writer,
  # so enabling this pins the API to 1 replica (strategy Recreate) and disables
  # the HPA. Leave disabled only for HA memory-only demos.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    existingClaim: ""
    mountPath: /data
  # -- Mount kubeconfig for out-of-cluster access (optional)
  kubeconfig:
    enabled: false
    secretName: ""
    mountPath: /etc/kubeconfig

# -- UI configuration (HTTPS by default, like Netra)
ui:
  image:
    repository: ghcr.io/zyvorai/paqtra-ui
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8443
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8443

# -- TLS for the UI (self-signed P-256 via init container). Set enabled=false
# only when TLS is terminated by a trusted ingress/proxy.
tls:
  enabled: true
  opensslImage: docker.io/alpine/openssl:3.3.2

# -- Node agent (DaemonSet on every node, like Cilium agent)
agent:
  enabled: true
  image:
    repository: ghcr.io/zyvorai/paqtra
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  port: 9192
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  tolerations:
    - operator: Exists
  updateStrategy:
    type: RollingUpdate
  bpf:
    # Mount host BPF filesystem for local map access
    mountPath: /sys/fs/bpf

# -- Ingress configuration
ingress:
  enabled: false
  className: ""  # nginx, cilium, traefik, etc.
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: paqtra.example.com
      paths:
        - path: /
          pathType: Prefix
          service: ui
          port: 8080
        - path: /api
          pathType: Prefix
          service: api
          port: 9191
        - path: /swagger-ui
          pathType: Prefix
          service: api
          port: 9191
  tls: []
  # - secretName: paqtra-tls
  #   hosts:
  #     - paqtra.example.com

# -- Authentication (empty password/apiKey → auto-generated on install)
auth:
  jwtSecret: ""  # If empty, auto-generated
  autoGenerate: true
  adminUsername: admin
  # Empty → Helm auto-generates. Lab pin is set only by scripts/deploy-remote.sh.
  adminPassword: ""
  apiKey: ""

# -- Monitoring configuration
monitoring:
  enabled: false
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRules:
    enabled: false
    rules: []
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

# -- RBAC configuration
rbac:
  create: true
  # -- Additional rules to add to the ClusterRole
  additionalRules: []
