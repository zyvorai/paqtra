nameOverride: ""
fullnameOverride: ""

# -- Global settings
global:
  # -- Namespace to deploy into
  namespace: cilium-vision
  # -- Image pull secrets
  imagePullSecrets: []

# -- API server configuration
api:
  image:
    repository: ghcr.io/ssahani/cilium-vision-api
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 2
  port: 9191
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    hubbleAddress: "hubble-relay.kube-system.svc.cluster.local:4245"
    redisUrl: ""  # auto-configured if redis.enabled
    jwtSecret: ""  # auto-generated if empty
    rustLog: "info"
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 9191
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # -- Mount kubeconfig for out-of-cluster access (optional)
  kubeconfig:
    enabled: false
    secretName: ""
    mountPath: /etc/kubeconfig

# -- UI configuration
ui:
  image:
    repository: ghcr.io/ssahani/cilium-vision-ui
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8080

# -- Redis configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  backup:
    enabled: false
    schedule: "0 2 * * *"
    storage:
      size: 1Gi
      storageClass: ""

# -- Ingress configuration
ingress:
  enabled: false
  className: ""  # nginx, cilium, traefik, etc.
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: cilium-vision.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 3001
        - path: /api
          pathType: Prefix
          service: backend
          port: 9191
        - path: /swagger-ui
          pathType: Prefix
          service: backend
          port: 9191
  tls: []
  # - secretName: cilium-vision-tls
  #   hosts:
  #     - cilium-vision.example.com

# -- Authentication configuration
auth:
  jwtSecret: ""  # If empty, auto-generated
  autoGenerate: true

# -- Monitoring configuration
monitoring:
  enabled: true
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRules:
    enabled: false
    rules: []
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

# -- RBAC configuration
rbac:
  create: true
  # -- Additional rules to add to the ClusterRole
  additionalRules: []
