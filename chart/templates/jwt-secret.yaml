{{- if and .Values.auth.autoGenerate (not .Values.auth.jwtSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paqtra.fullname" . }}-jwt
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "paqtra.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
{{- end }}
