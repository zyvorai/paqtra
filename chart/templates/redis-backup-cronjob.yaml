{{- if and .Values.redis.enabled .Values.redis.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cilium-vision.fullname" . }}-redis-backup
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "cilium-vision.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.backup.storage.size | default "1Gi" }}
  {{- if .Values.redis.backup.storage.storageClass }}
  storageClassName: {{ .Values.redis.backup.storage.storageClass | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cilium-vision.fullname" . }}-redis-backup
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "cilium-vision.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-backup
spec:
  schedule: {{ .Values.redis.backup.schedule | default "0 2 * * *" | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
            command:
            - sh
            - -c
            - redis-cli -h {{ include "cilium-vision.fullname" . }}-redis BGSAVE && sleep 5 && cp /data/dump.rdb /backup/dump-$(date +%Y%m%d).rdb
            volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: backup
              mountPath: /backup
          volumes:
          - name: redis-data
            persistentVolumeClaim:
              claimName: {{ include "cilium-vision.fullname" . }}-redis
          - name: backup
            persistentVolumeClaim:
              claimName: {{ include "cilium-vision.fullname" . }}-redis-backup
          restartPolicy: OnFailure
{{- end }}
