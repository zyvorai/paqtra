apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cilium-vision.fullname" . }}-config
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "cilium-vision.labels" . | nindent 4 }}
data:
  HUBBLE_ADDRESS: {{ .Values.api.env.hubbleAddress | quote }}
  REDIS_URL: {{ include "cilium-vision.redisUrl" . | quote }}
  RUST_LOG: {{ .Values.api.env.rustLog | quote }}
  API_PORT: {{ .Values.api.port | quote }}
