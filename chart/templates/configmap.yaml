apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paqtra.fullname" . }}-config
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "paqtra.labels" . | nindent 4 }}
data:
  HUBBLE_ADDRESS: {{ .Values.api.env.hubbleAddress | quote }}
  HUBBLE_MODE: {{ .Values.api.env.hubbleMode | default "grpc" | quote }}
  RUST_LOG: {{ .Values.api.env.rustLog | quote }}
  {{- with .Values.api.env.prometheusUrl }}
  PROMETHEUS_URL: {{ . | quote }}
  {{- end }}
  PAQTRA_HOST: "0.0.0.0"
  PAQTRA_PORT: {{ .Values.api.port | quote }}
