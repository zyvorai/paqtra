{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "paqtra.fullname" . }}-agent
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "paqtra.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  updateStrategy:
    {{- toYaml .Values.agent.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "paqtra.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paqtra.agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "paqtra.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: false
      tolerations:
        {{- toYaml .Values.agent.tolerations | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "paqtra.agent.image" . }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - agent
            - --listen
            - 0.0.0.0:{{ .Values.agent.port }}
          ports:
            - name: health
              containerPort: {{ .Values.agent.port }}
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUST_LOG
              value: {{ .Values.api.env.rustLog | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
              drop:
                - ALL
          volumeMounts:
            - name: bpf
              mountPath: {{ .Values.agent.bpf.mountPath }}
              readOnly: true
            - name: cilium-run
              mountPath: /var/run/cilium
              readOnly: true
      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cilium-run
          hostPath:
            path: /var/run/cilium
            type: DirectoryOrCreate
{{- end }}
