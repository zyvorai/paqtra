[package]
name = "cilium-vision-api"
version = "1.0.0"
edition = "2021"
authors = ["Cilium Vision Team"]
description = "REST API server for Cilium Vision web application"

[dependencies]
# Web framework
axum = { version = "0.8.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Redis cache
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Authentication
jsonwebtoken = "9.2"

# Tracing & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"

# Configuration
dotenvy = "0.15"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
