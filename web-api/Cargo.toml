[package]
name = "cilium-vision-api"
version = "1.0.0"
edition = "2021"
authors = ["Cilium Vision Team"]
description = "REST API server for Cilium Vision web application"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database (optional)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"], optional = true }

# Redis cache
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Authentication
jsonwebtoken = "9.2"
argon2 = "0.5"

# GraphQL
async-graphql = { version = "7.0", features = ["apollo_tracing"] }
async-graphql-axum = "7.0"

# Tracing & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cilium Vision core (reference to main crate)
cilium-tui = { path = ".." }

[features]
default = []
database = ["sqlx"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
