<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Network nodes -->
  <circle cx="256" cy="140" r="28" fill="white" opacity="0.95"/>
  <circle cx="160" cy="300" r="28" fill="white" opacity="0.95"/>
  <circle cx="352" cy="300" r="28" fill="white" opacity="0.95"/>
  <circle cx="256" cy="360" r="20" fill="white" opacity="0.7"/>
  <!-- Network lines -->
  <line x1="256" y1="168" x2="160" y2="272" stroke="white" stroke-width="4" opacity="0.6"/>
  <line x1="256" y1="168" x2="352" y2="272" stroke="white" stroke-width="4" opacity="0.6"/>
  <line x1="160" y1="300" x2="352" y2="300" stroke="white" stroke-width="4" opacity="0.6"/>
  <line x1="256" y1="340" x2="160" y2="300" stroke="white" stroke-width="3" opacity="0.4"/>
  <line x1="256" y1="340" x2="352" y2="300" stroke="white" stroke-width="3" opacity="0.4"/>
  <!-- Center eye/lens -->
  <circle cx="256" cy="240" r="50" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
  <circle cx="256" cy="240" r="20" fill="white" opacity="0.9"/>
  <!-- Flow arrows -->
  <path d="M200 180 L220 200" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M312 180 L292 200" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>
</svg>
