name: CLI end-to-end

# Installs Cilium and Paqtra into a real (kind) cluster with the paqtra CLI and
# exercises install, status, doctor, config, connectivity test, sysdump,
# upgrade and uninstall. Only runs when something it covers changes.
on:
  pull_request:
    paths:
      - 'src/cli/**'
      - 'src/main.rs'
      - 'chart/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'web-api/**'
      - 'web-ui/**'
      - 'scripts/ci-cli-e2e.sh'
      - 'scripts/kind-config.yaml'
      - '.github/workflows/cli-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: kind + paqtra CLI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build --locked

      - name: Build the images the chart deploys
        run: |
          docker build -t paqtra-api:ci web-api
          docker build -t paqtra-ui:ci web-ui
          docker build -t paqtra:ci .

      - name: Create a kind cluster (no CNI)
        uses: helm/kind-action@v1
        with:
          cluster_name: paqtra-e2e
          config: scripts/kind-config.yaml

      - name: Load the images into the cluster
        run: kind load docker-image paqtra-api:ci paqtra-ui:ci paqtra:ci --name paqtra-e2e

      - name: Run the end-to-end test
        run: PAQTRA=target/debug/paqtra scripts/ci-cli-e2e.sh

      # If it failed, the CLI's own tooling explains why.
      - name: Diagnose (doctor + sysdump)
        if: failure()
        run: |
          target/debug/paqtra doctor || true
          target/debug/paqtra sysdump -o paqtra-e2e-sysdump.zip || true

      - name: Upload the sysdump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paqtra-e2e-sysdump
          path: paqtra-e2e-sysdump.zip
          if-no-files-found: ignore
