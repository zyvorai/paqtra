repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bash -c 'cd web-ui && npx eslint'
        language: system
        files: '\.(ts|tsx)$'
        pass_filenames: false
