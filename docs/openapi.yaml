openapi: "3.0.3"

info:
  title: Paqtra API
  version: "2.0.0"
  description: >
    Paqtra — trace every flow. Network observability and security for
    Cilium, Hubble, and eBPF on Kubernetes. Real-time flow monitoring,
    anomaly detection, policy management, zero-trust scoring, multi-cluster
    visibility, cost analysis, and automated troubleshooting.
  contact:
    name: Paqtra Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: Local server (health and metrics live at the root)
  - url: /api/v1
    description: Primary API base path

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Flows
    description: Hubble flow observation and statistics
  - name: Policies
    description: CiliumNetworkPolicy CRUD and simulation
  - name: Anomalies
    description: ML-driven anomaly detection and remediation
  - name: Compliance
    description: Compliance frameworks and audit
  - name: Modules
    description: Autopolicy, Chaos, and Canary modules
  - name: Events
    description: Kubernetes event stream
  - name: Endpoints
    description: Cilium-managed endpoints
  - name: Nodes
    description: Kubernetes node inventory
  - name: Security
    description: Security posture, findings, and zero-trust scoring
  - name: Heatmap
    description: Namespace-to-namespace traffic heatmap
  - name: Dependencies
    description: Service dependency graph
  - name: Metrics
    description: Internal metrics and Prometheus exposition
  - name: Replay
    description: Flow recording and replay
  - name: Healer
    description: Automated problem detection and remediation
  - name: RootCause
    description: Packet drop root-cause analysis
  - name: MultiCluster
    description: Multi-cluster federation management
  - name: Alerts
    description: Alert rules and alert history
  - name: DNS
    description: DNS query monitoring and statistics
  - name: Bandwidth
    description: Per-pod bandwidth monitoring
  - name: IPAM
    description: IP Address Management pools and allocations
  - name: Encryption
    description: WireGuard / IPsec encryption status
  - name: LoadBalancer
    description: eBPF-based load balancer services
  - name: Ingress
    description: Ingress route configuration
  - name: Egress
    description: Egress gateway policies
  - name: ServiceMesh
    description: Cilium service mesh configuration
  - name: KPR
    description: KubeProxy Replacement status
  - name: BGP
    description: BGP peering sessions
  - name: ClusterMesh
    description: ClusterMesh peer management
  - name: Identities
    description: Cilium security identities
  - name: Diagnostics
    description: Cluster diagnostics and connectivity tests
  - name: Troubleshoot
    description: Automated troubleshooting workflows
  - name: SLO
    description: Service Level Objective tracking
  - name: Incidents
    description: Incident timeline and management
  - name: Changes
    description: Change log with rollback support
  - name: Capture
    description: Packet capture sessions
  - name: Mirror
    description: Traffic mirroring rules
  - name: Costs
    description: Namespace cost breakdown
  - name: Forecast
    description: Metric forecasting (ARIMA)
  - name: RBAC
    description: RBAC binding inventory
  - name: Host
    description: Host-level information
  - name: WireGuard
    description: WireGuard tunnel peers
  - name: CiliumStatus
    description: Per-node Cilium agent status
  - name: WebSocket
    description: Real-time streaming via WebSocket

# ──────────────────────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────────────────────
security:
  - BearerAuth: []

# ──────────────────────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────────────────────
paths:
  # ── Health ──────────────────────────────────────────────────
  /health:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Liveness probe
      description: >
        Returns the overall health status of the server and each subsystem
        (Redis, Hubble Relay, Kubernetes API).
      security: []
      responses:
        "200":
          description: All subsystems healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more critical subsystems unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      operationId: readinessCheck
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Service ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  # ── Flows ───────────────────────────────────────────────────
  /api/v1/flows:
    get:
      operationId: listFlows
      tags: [Flows]
      summary: List observed network flows
      description: >-
        `verdict` is applied by Hubble itself, so `limit` returns the most recent
        flows with that verdict (not the few matches among the last N). Flows carry
        an optional `hubble` object: identities, labels, `traffic_direction`,
        `is_reply`, `policy_match_type`, `trace_observation_point`, `node_name`.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - name: verdict
          in: query
          schema:
            type: string
            enum: [FORWARDED, DROPPED, AUDIT, REDIRECTED, ERROR, TRACED]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated flow list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/flows/{id}:
    get:
      operationId: getFlow
      tags: [Flows]
      summary: Get a single flow by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Flow detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/flows/stats:
    get:
      operationId: flowStats
      tags: [Flows]
      summary: Aggregated flow statistics
      responses:
        "200":
          description: Current flow statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowStats"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/flows/exports:
    get:
      operationId: listExportConfigs
      tags: [Flows]
      summary: List flow export configurations
      responses:
        "200":
          description: Export configuration list
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items:
                      $ref: "#/components/schemas/FlowExportConfig"
    post:
      operationId: createExportConfig
      tags: [Flows]
      summary: Create a flow export configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, format, destination]
              properties:
                name:
                  type: string
                format:
                  type: string
                  enum: [json, csv, cef]
                destination:
                  type: string
                filter:
                  type: string
      responses:
        "200":
          description: Export config created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowExportConfig"

  /api/v1/flows/exports/{id}:
    delete:
      operationId: deleteExportConfig
      tags: [Flows]
      summary: Delete a flow export configuration
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"

  # ── Policies ────────────────────────────────────────────────
  /api/v1/policies:
    get:
      operationId: listPolicies
      tags: [Policies]
      summary: List CiliumNetworkPolicies
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated policy list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPolicy
      tags: [Policies]
      summary: Create a CiliumNetworkPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "200":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/policies/{id}:
    get:
      operationId: getPolicy
      tags: [Policies]
      summary: Get a single policy by ID or name
      description: >-
        Returns the policy's `spec`, its `resource_version` (send it back on rule
        edits for optimistic concurrency) and per-direction `rule_counts`.
        `namespace/name` (URL-encoded) disambiguates a name used in several namespaces.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Policy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updatePolicy
      tags: [Policies]
      summary: Update an existing policy
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "200":
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deletePolicy
      tags: [Policies]
      summary: Delete a policy
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Policy deleted
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/policies/{id}/rules:
    post:
      operationId: addPolicyRule
      tags: [Policies]
      summary: Add a rule to a policy
      description: >-
        Appends one rule to the policy's `ingress`, `egress`, `ingressDeny` or
        `egressDeny` list and applies the result through the CiliumNetworkPolicy
        CRD. Requires the editor role and access to the policy's namespace.
        With `dry_run=true` the API server validates the change and nothing is
        persisted. A stale `resource_version` returns 409.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, rule]
              properties:
                direction:
                  $ref: "#/components/schemas/RuleDirection"
                rule:
                  type: object
                resource_version:
                  type: string
      responses:
        "200":
          description: Rule added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The policy changed since `resource_version` was read
    put:
      operationId: updatePolicyRule
      tags: [Policies]
      summary: Replace one rule of a policy
      description: Replaces the rule at `index` within `direction`. Same rules as adding.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, index, rule]
              properties:
                direction:
                  $ref: "#/components/schemas/RuleDirection"
                index:
                  type: integer
                  minimum: 0
                rule:
                  type: object
                resource_version:
                  type: string
      responses:
        "200":
          description: Rule replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The policy changed since `resource_version` was read
    delete:
      operationId: deletePolicyRule
      tags: [Policies]
      summary: Delete one rule of a policy
      description: >-
        Removes the rule at `index` within `direction`. The policy's last rule cannot
        be removed (400): Cilium rejects a policy with no rules, so delete the policy.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/DryRun"
        - name: direction
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RuleDirection"
        - name: index
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: resource_version
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Rule deleted (`result.removed` holds it)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The policy changed since `resource_version` was read

  /api/v1/policies/simulate:
    post:
      operationId: simulatePolicy
      tags: [Policies]
      summary: Dry-run impact analysis for a policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySimulationResult"

  /api/v1/policies/validate:
    post:
      operationId: validatePolicy
      tags: [Policies]
      summary: Validate a policy YAML without applying
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml:
                  type: string
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string

  /api/v1/policies/templates:
    get:
      operationId: listPolicyTemplates
      tags: [Policies]
      summary: List curated policy templates
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/PolicyTemplate"

  /api/v1/policies/templates/{id}/apply:
    post:
      operationId: applyPolicyTemplate
      tags: [Policies]
      summary: Apply a policy template to a namespace
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Template applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"

  # ── Anomalies ───────────────────────────────────────────────
  /api/v1/anomalies:
    get:
      operationId: listAnomalies
      tags: [Anomalies]
      summary: List detected anomalies
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated anomaly list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyListResponse"

  /api/v1/anomalies/{id}:
    get:
      operationId: getAnomaly
      tags: [Anomalies]
      summary: Get a single anomaly
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Anomaly detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/anomalies/{id}/remediate:
    post:
      operationId: remediateAnomaly
      tags: [Anomalies]
      summary: Trigger automated remediation for an anomaly
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Remediation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationResult"

  # ── Compliance ──────────────────────────────────────────────
  /api/v1/compliance/frameworks:
    get:
      operationId: listComplianceFrameworks
      tags: [Compliance]
      summary: List supported compliance frameworks
      responses:
        "200":
          description: Framework list
          content:
            application/json:
              schema:
                type: object
                properties:
                  frameworks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string

  /api/v1/compliance/audit:
    post:
      operationId: runComplianceAudit
      tags: [Compliance]
      summary: Run a compliance audit against a framework
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                framework:
                  type: string
      responses:
        "200":
          description: Audit result
          content:
            application/json:
              schema:
                type: object
                properties:
                  framework:
                    type: string
                  score:
                    type: number
                  controls_passed:
                    type: integer
                  controls_failed:
                    type: integer

  # ── Events ──────────────────────────────────────────────────
  /api/v1/events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: List Kubernetes events
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/K8sEvent"
                  total:
                    type: integer

  # ── Endpoints ───────────────────────────────────────────────
  /api/v1/endpoints:
    get:
      operationId: listEndpoints
      tags: [Endpoints]
      summary: List Cilium-managed endpoints
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Endpoint list
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items:
                      $ref: "#/components/schemas/CiliumEndpoint"
                  total:
                    type: integer

  # ── Nodes ───────────────────────────────────────────────────
  /api/v1/nodes:
    get:
      operationId: listNodes
      tags: [Nodes]
      summary: List Kubernetes nodes with Cilium status
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/K8sNode"
                  total:
                    type: integer

  /api/v1/nodes/drain/status:
    get:
      operationId: nodeDrainStatus
      tags: [Nodes]
      summary: Get drain status for all nodes
      responses:
        "200":
          description: Drain status per node
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/NodeDrainStatus"

  /api/v1/nodes/drain:
    post:
      operationId: drainNode
      tags: [Nodes]
      summary: Initiate graceful node drain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node]
              properties:
                node:
                  type: string
      responses:
        "200":
          description: Drain initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"

  /api/v1/nodes/uncordon:
    post:
      operationId: uncordonNode
      tags: [Nodes]
      summary: Uncordon a previously cordoned node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node]
              properties:
                node:
                  type: string
      responses:
        "200":
          description: Node uncordoned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"

  # ── Security ────────────────────────────────────────────────
  /api/v1/security/posture:
    get:
      operationId: securityPosture
      tags: [Security]
      summary: Overall security posture assessment
      responses:
        "200":
          description: Security posture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityPosture"

  /api/v1/security/findings:
    get:
      operationId: listSecurityFindings
      tags: [Security]
      summary: List security findings
      responses:
        "200":
          description: Finding list
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecurityFinding"

  /api/v1/security/zero-trust:
    get:
      operationId: zeroTrustScore
      tags: [Security]
      summary: Zero-trust maturity score breakdown
      responses:
        "200":
          description: Zero-trust scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZeroTrustScore"

  /api/v1/security/pods:
    get:
      operationId: podSecurity
      tags: [Security]
      summary: Pod security standard compliance per namespace
      responses:
        "200":
          description: Pod security reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/PodSecurityReport"

  # ── Heatmap ─────────────────────────────────────────────────
  /api/v1/heatmap:
    get:
      operationId: heatmapData
      tags: [Heatmap]
      summary: Namespace-to-namespace traffic heatmap
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapResponse"

  # ── Dependencies ────────────────────────────────────────────
  /api/v1/dependencies:
    get:
      operationId: listDependencies
      tags: [Dependencies]
      summary: Service dependency graph
      responses:
        "200":
          description: Dependency list
          content:
            application/json:
              schema:
                type: object
                properties:
                  dependencies:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceDependency"

  # ── Service Map ─────────────────────────────────────────────
  /api/v1/servicemap:
    get:
      operationId: serviceMap
      tags: [Dependencies]
      summary: Full service topology with nodes and edges
      responses:
        "200":
          description: Service map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceMapResponse"

  # ── Modules — Autopolicy ────────────────────────────────────
  /api/v1/modules/autopolicy/generate:
    post:
      operationId: generateAutopolicy
      tags: [Modules]
      summary: Auto-generate a CiliumNetworkPolicy from observed flows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace:
                  type: string
                label_selector:
                  type: string
      responses:
        "200":
          description: Generated policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy_yaml:
                    type: string
                  flows_analyzed:
                    type: integer

  # ── Modules — Chaos ─────────────────────────────────────────
  /api/v1/modules/chaos/experiments:
    get:
      operationId: listChaosExperiments
      tags: [Modules]
      summary: List chaos experiments
      responses:
        "200":
          description: Experiment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiments:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChaosExperiment"

  /api/v1/modules/chaos/run:
    post:
      operationId: runChaosExperiment
      tags: [Modules]
      summary: Execute a chaos experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experiment_id]
              properties:
                experiment_id:
                  type: string
                duration_secs:
                  type: integer
      responses:
        "200":
          description: Experiment started
          content:
            application/json:
              schema:
