  # ── Alerts ──────────────────────────────────────────────────
  /api/v1/alerts/rules:
    get:
      operationId: listAlertRules
      tags: [Alerts]
      summary: List alert rules
      responses:
        "200":
          description: Alert rule list
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertRule"
    post:
      operationId: createAlertRule
      tags: [Alerts]
      summary: Create an alert rule
      description: >-
        Requires the editor role. The condition must be one the engine can
        evaluate: `drop_rate > N%`, `dns_servfail > N/min`, `policy_denied > N/min`
        or `endpoint_status != ready`; anything else is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleInput"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/alerts/rules/{id}/definition:
    put:
      operationId: updateAlertRule
      tags: [Alerts]
      summary: Edit an alert rule's name, condition and severity
      description: >-
        Keeps the id and trigger history. `enabled` is changed only if sent.
        A stored condition may be left unchanged even if the engine cannot evaluate it.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleInput"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/alerts/rules/{id}:
    delete:
      operationId: deleteAlertRule
      tags: [Alerts]
      summary: Delete an alert rule
      description: >-
        The five seeded default rules (`rule-001`..`rule-005`) need `force=true`;
        without it they are refused with 400 (disable them instead). Deleting every
        rule does not bring the defaults back.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Rule deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: toggleAlertRule
      tags: [Alerts]
      summary: Enable or disable an alert rule
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"

