  # ── Latency Analysis ────────────────────────────────────────
  /api/v1/latency/analysis:
    get:
      operationId: latencyAnalysis
      tags: [Metrics]
      summary: Per-service latency percentile analysis
      responses:
        "200":
          description: Latency analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatencyAnalysis"

  # ── Audit Log ───────────────────────────────────────────────
  /api/v1/audit/log:
    get:
      operationId: auditLog
      tags: [Security]
      summary: API audit trail
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  total:
                    type: integer

  # ── WireGuard ───────────────────────────────────────────────
  /api/v1/wireguard/peers:
    get:
      operationId: wireguardPeers
      tags: [WireGuard]
      summary: List WireGuard tunnel peers
      responses:
        "200":
          description: Peer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  peers:
                    type: array
                    items:
                      $ref: "#/components/schemas/WireGuardPeer"

  # ── Cilium / Hubble insights (read-only) ──────────────────
  /api/v1/cilium/features:
    get:
      operationId: ciliumFeatures
      tags: [CiliumStatus]
      summary: Which Cilium features the cluster has enabled
      description: >-
        Read from the `cilium-config` ConfigMap. `state` is `enabled`, `disabled`,
        `set` (a setting with a value) or `unknown` when the key is absent, which
        means an older Cilium or a feature that was never configured, not that it is off.
      responses:
        "200":
          description: "Feature list (`available: false` when the ConfigMap cannot be read)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  reason:
                    type: string
                  features:
                    type: array
                    items:
                      $ref: "#/components/schemas/CiliumFeature"

  /api/v1/cilium/resources/{kind}:
    get:
      operationId: ciliumResources
      tags: [CiliumStatus]
      summary: List a Cilium (or Cilium-served Gateway API) custom resource
      description: >-
        `kind` is one of `nodes`, `egress-gateway-policies`, `bgp-peering-policies`,
        `bgp-cluster-configs`, `bgp-peer-configs`, `bgp-advertisements`,
        `bgp-node-configs`, `lb-ip-pools`, `l2-announcement-policies`, `pod-ip-pools`,
        `cidr-groups`, `gateway-classes`, `gateways`, `http-routes`. Anything else is 404.
        Read-only; cluster-wide, so not available to namespace-scoped users.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Items with `spec` and `status` (`installed: false` when the CRD is absent)"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/cilium/metrics:
    get:
      operationId: ciliumMetrics
      tags: [CiliumStatus]
      summary: Cilium agent metrics from Prometheus
      description: >-
        A fixed catalog of queries (drops by reason, forwarded packets, endpoint
        state, policy enforcement, unreachable nodes, BPF map pressure, ...). Needs
        `PROMETHEUS_URL`; without it `available` is false and `reason` says so.
      responses:
        "200":
          description: Metric groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsReport"

  /api/v1/hubble/metrics:
    get:
      operationId: hubbleMetrics
      tags: [CiliumStatus]
      summary: Hubble flow metrics from Prometheus
      description: >-
        Flows by verdict, drops by reason, policy verdicts, DNS by rcode, HTTP by
        status, TCP flags, ICMP and lost events. A group with no data carries a `hint`
        naming the `hubble.metrics.enabled` entry that exports it.
      responses:
        "200":
          description: Metric groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsReport"

  /api/v1/hubble/nodes:
    get:
      operationId: hubbleNodes
      tags: [CiliumStatus]
      summary: Nodes behind Hubble Relay, with flow-buffer fill
      description: >-
        From Hubble `GetNodes`. `num_flows == max_flows` means the node's ring
        buffer is full and older flows are being overwritten.
      responses:
        "200":
          description: Node list, plus per-cluster `errors`

  /api/v1/cilium/agent/{what}:
    get:
      operationId: ciliumAgentQuery
      tags: [CiliumStatus]
      summary: Read-only query against one Cilium agent
      description: >-
        `what` is `endpoints`, `identities`, `services`, `fqdn-cache`, `status` or
        `policy-selectors` (anything else is 404). Runs the matching `cilium-dbg ... -o json` in the first
        agent pod found, so it samples one node. Editor role. A failing agent is 502
        with the reason.
      parameters:
        - name: what
          in: path
          required: true
          schema:
            type: string
            enum: [endpoints, identities, services, fqdn-cache, status, policy-selectors]
      responses:
        "200":
          description: "The agent's JSON output under `data`"
        "403":
          description: Editor role required
        "502":
          description: The agent could not be reached or the command failed

  # ── Cilium Status ───────────────────────────────────────────
  /api/v1/cilium/status:
    get:
      operationId: ciliumStatus
      tags: [CiliumStatus]
      summary: Per-node Cilium agent status
      responses:
        "200":
          description: Agent status list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/CiliumAgentStatus"

  # ── WebSocket ───────────────────────────────────────────────
  /api/v1/ws/flows:
    get:
      operationId: wsFlows
      tags: [WebSocket]
      summary: Real-time flow stream (WebSocket upgrade)
      description: >
        Upgrades to a WebSocket connection that streams JSON-encoded Flow
        objects in real time.
      responses:
        "101":
          description: Switching Protocols -- WebSocket connection established

  /api/v1/ws/metrics:
    get:
      operationId: wsMetrics
      tags: [WebSocket]
      summary: Real-time metrics stream (WebSocket upgrade)
      description: >
        Upgrades to a WebSocket connection that pushes periodic MetricsSummary
        snapshots.
      responses:
        "101":
          description: Switching Protocols -- WebSocket connection established

# ──────────────────────────────────────────────────────────────
# Components
# ──────────────────────────────────────────────────────────────
components:

  # ── Security Schemes ────────────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT token issued by the cluster identity provider. Include in the
        Authorization header as `Bearer <token>`.

  # ── Reusable Parameters ─────────────────────────────────────
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique resource identifier

    DryRun:
      name: dry_run
      in: query
      schema:
        type: boolean
        default: false
      description: Validate against the cluster (server-side dry run) without persisting

    Namespace:
      name: namespace
      in: query
      schema:
        type: string
      description: Kubernetes namespace filter

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: Maximum number of items to return

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of items to skip for pagination

  # ── Reusable Responses ──────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request (the `error` field says why)
    NotFound:
      description: Resource not found
    InternalError:
      description: Internal server error

  # ── Schemas ─────────────────────────────────────────────────
  schemas:

    CiliumFeature:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        category:
          type: string
        state:
          type: string
          enum: [enabled, disabled, set, unknown]
        value:
          type: string
        config_key:
          type: string
          description: The cilium-config key that answered (newer name preferred)
        view:
          type: string
          description: Paqtra page that shows this feature

    MetricsReport:
      type: object
      properties:
        available:
          type: boolean
        reason:
          type: string
        window:
          type: string
          example: 5m
        metrics:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              title:
                type: string
              unit:
                type: string
              series:
                type: array
                items:
                  type: object
                  properties:
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    value:
                      type: number
              hint:
                type: string
                nullable: true
              error:
                type: string
                nullable: true

    RuleDirection:
      type: string
      enum: [ingress, egress, ingressDeny, egressDeny]

    PolicyDetail:
      allOf:
        - $ref: "#/components/schemas/Policy"
        - type: object
          properties:
            resource_version:
              type: string
            rule_counts:
              type: object
              additionalProperties:
                type: integer
            spec:
              type: object

    RuleChangeResult:
      type: object
      properties:
        policy:
          type: string
          description: namespace/name
        action:
          type: string
          enum: [add, edit, delete]
        direction:
          $ref: "#/components/schemas/RuleDirection"
        dry_run:
          type: boolean
        rule_counts:
          type: object
          additionalProperties:
            type: integer
        spec:
          type: object
          description: The resulting policy spec
        result:
          type: object
          properties:
            index:
              type: integer
            removed:
              type: object

    AlertRuleInput:
      type: object
      required: [name, condition, severity]
      properties:
        name:
          type: string
          maxLength: 100
        condition:
          type: string
          maxLength: 200
        severity:
          type: string
          enum: [critical, high, warning, info]
        enabled:
          type: boolean

    # ── Generic ────────────────────────────────────────────────
    StatusMessage:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        id:
          type: string

    # ── Health ─────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status, uptime_secs, subsystems]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        uptime_secs:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        subsystems:
          type: object
          properties:
            cache:
              type: string
              enum: [ok, error]
            hubble_relay:
              type: string
              enum: [ok, unavailable]
            kubernetes:
              type: string
              enum: [ok, unavailable]

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, degraded, not_ready]
        version:
          type: string
        uptime_secs:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string

    ClusterHealthSummary:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              version:
                type: string
              instances:
                type: integer
              ready:
                type: integer
              message:
                type: string
        kubernetes:
          type: object
          properties:
            version:
              type: string
            platform:
              type: string
            nodes_total:
              type: integer
            nodes_ready:
              type: integer
            pods_total:
              type: integer
            pods_running:
              type: integer
            pods_pending:
              type: integer
            pods_failed:
              type: integer
        cilium:
          type: object
          properties:
            version:
              type: string
            datapath_mode:
              type: string
            ipam_mode:
              type: string
            kube_proxy_replacement:
              type: string
            host_routing:
              type: string
            masquerading:
              type: string
            encryption:
              type: string
        last_check:
          type: string
          format: date-time

    # ── Flows ──────────────────────────────────────────────────
    Flow:
      type: object
      required: [id, timestamp, source, destination, verdict, protocol, port]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/FlowEndpoint"
        destination:
          $ref: "#/components/schemas/FlowEndpoint"
        verdict:
          type: string
          enum: [FORWARDED, DROPPED, AUDIT, REDIRECTED, ERROR, TRACED]
        protocol:
          type: string
        port:
          type: integer

    FlowEndpoint:
      type: object
      properties:
        namespace:
          type: string
        pod:
          type: string
        ip:
          type: string

    FlowListResponse:
      type: object
      properties:
        flows:
          type: array
          items:
            $ref: "#/components/schemas/Flow"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        cached:
          type: boolean

    FlowStats:
      type: object
      properties:
        total_flows:
          type: integer
          format: int64
        forwarded:
          type: integer
          format: int64
        dropped:
          type: integer
          format: int64
        requests_per_second:
          type: number
          format: double
        avg_latency_ms:
          type: number
          format: double

    FlowExportConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        format:
          type: string
          enum: [json, csv, cef]
        destination:
          type: string
        filter:
          type: string
        status:
          type: string
          enum: [active, paused]
        exported_count:
          type: integer
          format: int64
        last_export:
          type: string
          format: date-time

    # ── Policies ───────────────────────────────────────────────
    Policy:
      type: object
      required: [id, name, namespace, status]
      properties:
        id:
          type: string
        name:
          type: string
        namespace:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string

    CreatePolicyRequest:
      type: object
      required: [name, namespace, spec]
      properties:
        name:
          type: string
        namespace:
          type: string
        spec:
          type: object
          description: CiliumNetworkPolicy spec (endpointSelector, ingress, egress, etc.)
          additionalProperties: true

    PolicyListResponse:
      type: object
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/Policy"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PolicySimulationResult:
      type: object
      properties:
        policy:
          type: string
        namespace:
          type: string
        analysis:
          type: object
          properties:
            ingress_rules:
              type: integer
            egress_rules:
              type: integer
            total_rules:
              type: integer
            has_endpoint_selector:
              type: boolean
            has_port_restrictions:
              type: boolean
        impact:
          type: object
          properties:
            estimated_flows_affected:
              type: integer
              format: int64
            services_impacted:
              type: integer
            risk_level:
              type: string
              enum: [low, medium, high]

    PolicyTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        yaml:
          type: string

    # ── Anomalies ──────────────────────────────────────────────
    Anomaly:
      type: object
      required: [id, detected_at, severity, anomaly_type, description, source_namespace, status]
      properties:
        id:
          type: string
        detected_at:
          type: string
          format: date-time
        severity:
          type: string
          enum: [low, medium, high, critical]
        anomaly_type:
          type: string
          enum: [traffic_spike, port_scan, latency_increase, dns_anomaly, data_exfiltration]
        description:
          type: string
        source_namespace:
          type: string
        source_pod:
          type: string
          nullable: true
        destination_namespace:
          type: string
          nullable: true
        destination_pod:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, investigating, resolved, dismissed]
        remediation:
          type: string
          nullable: true

    AnomalyListResponse:
      type: object
      properties:
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/Anomaly"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        detection_engine:
          type: string
        engine_version:
          type: string
        detection_window_secs:
          type: integer

    RemediationResult:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        action_taken:
          type: string
        timestamp:
          type: string
          format: date-time

    # ── Events ─────────────────────────────────────────────────
    K8sEvent:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum: [Normal, Warning]
        reason:
          type: string
        message:
          type: string
        object:
          type: string
        namespace:
          type: string
        count:
          type: integer

    # ── Endpoints ──────────────────────────────────────────────
    CiliumEndpoint:
      type: object
      properties:
        id:
          type: integer
        pod_name:
          type: string
        namespace:
          type: string
        identity:
          type: integer
        ipv4:
          type: string
        ipv6:
          type: string
        state:
          type: string
          enum: [ready, waiting-for-identity, not-ready, disconnected, restoring]
        policy_enforcement:
          type: string
        ingress_enforced:
          type: boolean
        egress_enforced:
          type: boolean

    # ── Nodes ──────────────────────────────────────────────────
    K8sNode:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [Ready, NotReady, SchedulingDisabled]
        role:
          type: string
        kubelet_version:
          type: string
        os_image:
          type: string
        kernel_version:
          type: string
        container_runtime:
          type: string
        cilium_version:
          type: string
        pod_cidr:
          type: string
        internal_ip:
          type: string
        cpu_capacity:
          type: integer
        memory_capacity_gi:
          type: number

    NodeDrainStatus:
      type: object
      properties:
        node:
          type: string
        status:
          type: string
          enum: [ready, cordoned, draining]
        pods_evicted:
          type: integer
        pods_remaining:
          type: integer
        started_at:
          type: string
          format: date-time
          nullable: true
        cordon:
          type: boolean

    # ── Security ───────────────────────────────────────────────
    SecurityPosture:
      type: object
      properties:
        overall_score:
          type: integer
        grade:
          type: string
        findings_by_severity:
          type: object
          properties:
            critical:
              type: integer
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer

    SecurityFinding:
      type: object
      required: [id, category, severity, title]
      properties:
        id:
          type: string
        category:
          type: string
          enum: [network_policy, encryption, identity, least_privilege, runtime]
        severity:
          type: string
          enum: [low, medium, high, critical]
        title:
          type: string
        description:
          type: string
        resource:
          type: string
        namespace:
          type: string
        remediation:
          type: string
        status:
          type: string
          enum: [open, acknowledged, resolved, dismissed]

    ZeroTrustScore:
      type: object
      properties:
        overall:
          type: integer
          minimum: 0
          maximum: 100
        network_segmentation:
          type: integer
        identity_verification:
          type: integer
        encryption:
          type: integer
        least_privilege:
          type: integer
        monitoring:
          type: integer

    PodSecurityReport:
      type: object
      properties:
        namespace:
          type: string
        enforce_level:
          type: string
          enum: [privileged, baseline, restricted]
        audit_level:
          type: string
        warn_level:
          type: string
        total_pods:
          type: integer
        compliant_pods:
          type: integer
        violations:
          type: array
          items:
            type: object
            properties:
              pod:
                type: string
              violation:
                type: string
              severity:
                type: string

    AuditEntry:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        action:
          type: string
        actor:
          type: string
        resource:
          type: string
        namespace:
          type: string
        details:
          type: string
        outcome:
          type: string
          enum: [success, failure]

    # ── Heatmap ────────────────────────────────────────────────
    HeatmapResponse:
      type: object
      properties:
        cells:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapCell"
        namespaces:
          type: array
          items:
            type: string

    HeatmapCell:
      type: object
      properties:
        source_namespace:
          type: string
        destination_namespace:
          type: string
        flow_count:
          type: integer
          format: int64
        dropped_count:
          type: integer
          format: int64
        avg_latency_ms:
          type: number
          format: double

    # ── Dependencies ───────────────────────────────────────────
    ServiceDependency:
      type: object
      properties:
        source:
          type: string
        destination:
          type: string
        protocol:
          type: string
        port:
          type: integer
        request_rate:
          type: number
          format: double
        error_rate:
          type: number
          format: double
        latency_p50:
          type: number
          format: double
        latency_p99:
          type: number
          format: double

    ServiceMapResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              namespace:
                type: string
              type:
                type: string
              pods:
                type: integer
              status:
                type: string
              request_rate:
                type: number
              error_rate:
                type: number
        edges:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              target:
                type: string
              protocol:
                type: string
              request_rate:
                type: number
              latency_ms:
                type: number

    # ── Modules ────────────────────────────────────────────────
    ChaosExperiment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [latency, packet-loss, partition, dns-failure, bandwidth-limit]
        target_namespace:
          type: string
        target_labels:
          type: object
          additionalProperties:
            type: string
        duration_secs:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed]

    CanaryStatus:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        namespace:
          type: string
        status:
          type: string
          enum: [progressing, succeeded, failed, paused]
        weight:
          type: integer
          description: Percentage of traffic routed to canary
        success_rate:
          type: number
        latency_p99_ms:
          type: number
        iterations:
          type: integer

    # ── Replay ─────────────────────────────────────────────────
