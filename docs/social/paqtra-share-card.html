<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paqtra share card</title>
<!--
  1200x630 card: README hero and the website's social preview (og:image).
  Build:  ./docs/social/build-social-card.sh   ->  paqtra-share-card.png
  Claims are limited to AGENTS.md / docs/cilium-brotherhood.md: Paqtra observes, Cilium decides.
-->
<style>
  :root { --bg:#050709; --ink:#f5f5f7; --soft:#a1a1aa; --blue:#0a84ff; --blue-d:#0071e3; --green:#30d158; --red:#ff453a;
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; position:relative; color:var(--ink); font-family:var(--sans);
    background:radial-gradient(ellipse 620px 420px at 900px 315px, rgba(10,132,255,.16), transparent 70%), var(--bg); }
  .grid { position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size:28px 28px; }
  .bar { position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--blue); }

  .left { position:absolute; left:64px; top:96px; width:560px; }
  .eyebrow { font-family:var(--mono); font-size:15px; letter-spacing:.24em; text-transform:uppercase; color:var(--blue); }
  h1 { margin:22px 0 0; font-size:150px; line-height:1; letter-spacing:-.045em; font-weight:700; }
  .sub { margin:26px 0 0; font-size:26px; line-height:1.36; color:#d2d2d7; font-weight:500; }
  .chips { margin-top:28px; display:flex; flex-wrap:wrap; gap:10px; }
  .chip { font-family:var(--mono); font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--blue);
    padding:8px 15px; border:1px solid rgba(10,132,255,.5); background:rgba(10,132,255,.1); border-radius:999px; }
  .foot { position:absolute; left:64px; bottom:38px; font-family:var(--mono); font-size:15px; color:#71717a; }

  svg { position:absolute; left:640px; top:60px; }
  svg text { font-family:var(--mono); font-size:13px; letter-spacing:.14em; fill:#d2d2d7; }
  svg .dim { fill:#71717a; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="bar"></div>

<div class="left">
  <div class="eyebrow">Cilium-native observability</div>
  <h1>Paqtra</h1>
  <p class="sub">Trace every flow. See where traffic goes and why Cilium allows or drops it &mdash; for Kubernetes.</p>
  <div class="chips"><span class="chip">Hubble flows</span><span class="chip">Web + API + TUI</span><span class="chip">Enforcement stays with Cilium</span><span class="chip">Apache 2.0</span></div>
</div>
<div class="foot">github.com/zyvorai/paqtra &middot; v0.1</div>

<!-- flow trace: source -> Cilium datapath (verdict) -> forwarded / dropped -->
<svg width="520" height="510" viewBox="0 0 520 510" fill="none">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8z" fill="#5b8fd6"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8z" fill="#30d158"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8z" fill="#ff453a"/></marker>
  </defs>

  <!-- source pod -->
  <rect x="10" y="215" width="130" height="80" rx="14" fill="#0b0f14" stroke="#3a4a63" stroke-width="1.5"/>
  <text x="75" y="248" text-anchor="middle">POD</text>
  <text x="75" y="270" text-anchor="middle" class="dim" style="font-size:11px">frontend</text>
  <path d="M142 255 H210" stroke="#5b8fd6" stroke-width="2" marker-end="url(#a)"/>

  <!-- Cilium datapath / verdict -->
  <circle cx="265" cy="255" r="58" fill="#0a1424" stroke="#0a84ff" stroke-width="2.5"/>
  <circle cx="265" cy="255" r="78" stroke="#0a84ff" stroke-width="1" stroke-dasharray="3 6" opacity=".45"/>
  <text x="265" y="251" text-anchor="middle" style="font-size:14px;fill:#fff">CILIUM</text>
  <text x="265" y="272" text-anchor="middle" class="dim" style="font-size:11px">verdict</text>

  <!-- forwarded -->
  <path d="M322 232 C 370 200, 380 130, 420 120" stroke="#30d158" stroke-width="2" marker-end="url(#g)"/>
  <rect x="386" y="85" width="128" height="72" rx="14" fill="#0b0f14" stroke="#1f6b3a" stroke-width="1.5"/>
  <circle cx="406" cy="106" r="5" fill="#30d158"/>
  <text x="420" y="110" style="font-size:12px;fill:#30d158">FORWARDED</text>
  <text x="450" y="136" text-anchor="middle" class="dim" style="font-size:11px">backend</text>

  <!-- dropped -->
  <path d="M322 278 C 370 310, 380 380, 420 390" stroke="#ff453a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <rect x="386" y="353" width="128" height="72" rx="14" fill="#0b0f14" stroke="#7a2a26" stroke-width="1.5"/>
  <circle cx="406" cy="374" r="5" fill="#ff453a"/>
  <text x="420" y="378" style="font-size:12px;fill:#ff453a">DROPPED</text>
  <text x="450" y="404" text-anchor="middle" class="dim" style="font-size:11px">policy denied</text>

  <!-- read-only labels -->
  <text x="265" y="365" text-anchor="middle" class="dim" style="font-size:11px">HUBBLE &middot; READ-ONLY</text>
  <text x="265" y="384" text-anchor="middle" class="dim" style="font-size:11px">PAQTRA OBSERVES</text>
</svg>
</body>
</html>
